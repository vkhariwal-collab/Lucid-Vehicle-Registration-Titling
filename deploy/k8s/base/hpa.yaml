apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: temp-tag-svc
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: temp-tag-svc }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
